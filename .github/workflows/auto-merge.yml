name: Auto-Merge Passing PRs

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'check_suite' ||
      github.event.sender.login == 'xarlord' ||
      contains(github.event.pull_request.head.ref, 'auto-review')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Evaluate protected checks and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/auto_merge_readiness.py"
          --repo "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_PATH"
