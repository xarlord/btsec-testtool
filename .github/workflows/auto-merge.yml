name: Auto-Merge Passing PRs

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Evaluate protected checks and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/auto_merge_readiness.py"
          --repo "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_PATH"
