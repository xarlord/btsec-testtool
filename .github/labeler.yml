# PR Labeler Configuration
# Automatically labels PRs based on changed files

documentation:
  - any: ['*.md']
  - any: ['docs/**']

security:
  - any: ['SECURITY.md']
  - any: ['**/security/**']

tests:
  - any: ['**/test/**']
  - any: ['**/*Test.kt']
  - any: ['**/*Test.java']
  - any: ['**/androidTest/**']

ci-cd:
  - any: ['.github/workflows/**']
  - any: ['.github/actions/**']
  - any: ['Dockerfile']
  - any: ['docker-compose.yml']

dependencies:
  - any: ['build.gradle.kts']
  - any: ['app/build.gradle.kts']
  - any: ['buildSrc/**/*.kt']
  - any: ['gradle/libs.versions.toml']

domain:
  - any: ['domain/model/**']
  - any: ['domain/repository/**']
  - any: ['domain/usecase/**']

data:
  - any: ['data/**']

presentation:
  - any: ['presentation/**']
  - any: ['ui/**']

android:
  - any: ['app/src/main/**']
  - any: ['AndroidManifest.xml']

vulnerability:
  - any: ['**/vulnerability/**']
  - any: ['**/vuln/**']

fuzzing:
  - any: ['**/fuzzing/**']
  - any: ['**/fuzz/**']

key-extraction:
  - any: ['**/keyextraction/**']
  - any: ['**/keys/**']

reporting:
  - any: ['**/report/**']
  - any: ['**/reports/**']

authorization:
  - any: ['**/authorization/**']
  - any: ['**/auth/**']

bluetooth:
  - any: ['**/bluetooth/**']
  - any: ['**/ble/**']
