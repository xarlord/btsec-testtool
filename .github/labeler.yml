# PR Labeler Configuration
# Automatically labels PRs based on changed files

documentation:
  - changed-files:
    - any-glob-to-any-file: ['*.md']
    - any-glob-to-any-file: ['docs/**']

security:
  - changed-files:
    - any-glob-to-any-file: [SECURITY.md]
    - any-glob-to-any-file: ['**/security/**']

tests:
  - changed-files:
    - any-glob-to-any-file: ['**/test/**']
    - any-glob-to-any-file: ['**/*Test.kt']
    - any-glob-to-any-file: ['**/*Test.java']
    - any-glob-to-any-file: ['**/androidTest/**']

ci-cd:
  - changed-files:
    - any-glob-to-any-file: ['.github/workflows/**']
    - any-glob-to-any-file: ['.github/actions/**']
    - any-glob-to-any-file: [Dockerfile]
    - any-glob-to-any-file: [docker-compose.yml]

dependencies:
  - changed-files:
    - any-glob-to-any-file: [build.gradle.kts]
    - any-glob-to-any-file: [app/build.gradle.kts]
    - any-glob-to-any-file: ['buildSrc/**/*.kt']
    - any-glob-to-any-file: [gradle/libs.versions.toml]

domain:
  - changed-files:
    - any-glob-to-any-file: ['domain/model/**']
    - any-glob-to-any-file: ['domain/repository/**']
    - any-glob-to-any-file: ['domain/usecase/**']

data:
  - changed-files:
    - any-glob-to-any-file: ['data/**']

presentation:
  - changed-files:
    - any-glob-to-any-file: ['presentation/**']
    - any-glob-to-any-file: ['ui/**']

android:
  - changed-files:
    - any-glob-to-any-file: ['app/src/main/**']
    - any-glob-to-any-file: [AndroidManifest.xml]

vulnerability:
  - changed-files:
    - any-glob-to-any-file: ['**/vulnerability/**']
    - any-glob-to-any-file: ['**/vuln/**']

fuzzing:
  - changed-files:
    - any-glob-to-any-file: ['**/fuzzing/**']
    - any-glob-to-any-file: ['**/fuzz/**']

key-extraction:
  - changed-files:
    - any-glob-to-any-file: ['**/keyextraction/**']
    - any-glob-to-any-file: ['**/keys/**']

reporting:
  - changed-files:
    - any-glob-to-any-file: ['**/report/**']
    - any-glob-to-any-file: ['**/reports/**']

authorization:
  - changed-files:
    - any-glob-to-any-file: ['**/authorization/**']
    - any-glob-to-any-file: ['**/auth/**']

bluetooth:
  - changed-files:
    - any-glob-to-any-file: ['**/bluetooth/**']
    - any-glob-to-any-file: ['**/ble/**']
