# PR Labeler Configuration
# Automatically labels PRs based on changed files

documentation:
  - any:
    - "**/*.md"
    - "docs/**"

security:
  - any:
    - "SECURITY.md"
    - "**/security/**"

tests:
  - any:
    - "**/test/**"
    - "**/*Test.kt"
    - "**/*Test.java"
    - "**/androidTest/**"

ci-cd:
  - any:
    - ".github/workflows/**"
    - ".github/actions/**"
    - "Dockerfile"
    - "docker-compose.yml"

dependencies:
  - any:
    - "build.gradle.kts"
    - "app/build.gradle.kts"
    - "buildSrc/**/*.kt"
    - "gradle/libs.versions.toml"

domain:
  - any:
    - "domain/model/**"
    - "domain/repository/**"
    - "domain/usecase/**"

data:
  - any:
    - "data/**"

presentation:
  - any:
    - "presentation/**"
    - "ui/**"

android:
  - any:
    - "app/src/main/**"
    - "AndroidManifest.xml"

vulnerability:
  - any:
    - "**/vulnerability/**"
    - "**/vuln/**"

fuzzing:
  - any:
    - "**/fuzzing/**"
    - "**/fuzz/**"

key-extraction:
  - any:
    - "**/keyextraction/**"
    - "**/keys/**"

reporting:
  - any:
    - "**/report/**"
    - "**/reports/**"

authorization:
  - any:
    - "**/authorization/**"
    - "**/auth/**"

bluetooth:
  - any:
    - "**/bluetooth/**"
    - "**/ble/**"
