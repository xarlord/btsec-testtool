# ============================================
# Pipeline Configuration
# ============================================
when:
  event:
    - push
    - pull_request
    - tag
  branch:
    - main
    - develop
  exclude:
    - message: "[skip ci]"
    - message: "[skip woodpecker]"

# Skip specific steps
skip_workflow: "[skip ci]"

# Global environment variables
environment:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
  ANDROID_HOME: "/opt/android-sdk"

# ============================================
# Pipeline Stages
# ============================================
steps:

  # ============================================
  # Stage 1: Code Quality & Linting
  # ============================================
  ktlint:
    image: android-ci:latest
    group: lint
    when:
      not:
        message: "[skip ktlint]"
    commands:
      - echo "🔍 Running Kotlin Linting (ktlint)..."
      - curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.0.1/ktlint
      - chmod +x ktlint
      - ./ktlint --reporter=checkstyle,output=build/ktlint-report.xml "**/*.kt" "**/*.kts"
      - echo "✅ ktlint complete - report saved to build/ktlint-report.xml"
    secrets: [ ]

  # ============================================
  # Stage 2: Documentation Check
  # ============================================
  docs-check:
    image: android-ci:latest
    group: validation
    commands:
      - echo "📚 Checking documentation..."
      - |
        # Check for README
        if [ ! -f README.md ]; then
          echo "❌ ERROR: README.md not found"
          exit 1
        fi
        echo "✅ README.md found"

        # Check for LICENSE
        if [ ! -f LICENSE ]; then
          echo "❌ ERROR: LICENSE file not found"
          exit 1
        fi
        echo "✅ LICENSE found"

        # Check test coverage documentation
        if [ -f TEST_COVERAGE_REPORT.md ]; then
          if grep -q "100%" TEST_COVERAGE_REPORT.md; then
            echo "✅ Test coverage documented at 100%"
          fi
        else
          echo "⚠️  WARNING: TEST_COVERAGE_REPORT.md not found"
        fi

        # Verify legal disclaimers in source
        echo "🔍 Checking for legal disclaimers..."
        disclaimer_count=$(grep -r "AUTHORIZED security testing" --include="*.kt" app/src/main 2>/dev/null | wc -l || echo "0")
        if [ "$disclaimer_count" -lt 5 ]; then
          echo "⚠️  WARNING: Legal disclaimers may be missing from some files (found: $disclaimer_count)"
        else
          echo "✅ Found $disclaimer_count files with legal disclaimers"
        fi
    secrets: [ ]

  # ============================================
  # Stage 3: Security Checklist
  # ============================================
  security-checklist:
    image: android-ci:latest
    group: validation
    commands:
      - echo "🔒 Running security checklist..."

      # Check for hardcoded secrets
      - |
        echo "🔍 Checking for potential hardcoded secrets..."
        if grep -rE "(sk_|pk_|api[_-]?key|secret|password|token)\s*=\s*['\"]" \
          --include="*.kt" --include="*.java" --exclude-dir=build app/src/main 2>/dev/null; then
          echo "⚠️  WARNING: Potential hardcoded secrets found!"
        else
          echo "✅ No hardcoded secrets detected"
        fi

      # Verify Android permissions
      - |
        echo "🔍 Checking Android permissions..."
        if ! grep -q "BLUETOOTH_CONNECT" app/src/main/AndroidManifest.xml 2>/dev/null; then
          echo "❌ ERROR: Missing BLUETOOTH_CONNECT permission"
          exit 1
        fi
        if ! grep -q "BLUETOOTH_SCAN" app/src/main/AndroidManifest.xml 2>/dev/null; then
          echo "❌ ERROR: Missing BLUETOOTH_SCAN permission"
          exit 1
        fi
        echo "✅ All required permissions present"

      # Check authorization enforcement
      - |
        echo "🔍 Verifying authorization enforcement..."
        if ! grep -r "requestActionAuthorization" app/src/main 2>/dev/null; then
          echo "⚠️  WARNING: Authorization checks may be missing in some use cases"
        fi
        if ! grep -r "TestScope" app/src/main 2>/dev/null; then
          echo "❌ ERROR: TestScope validation not found"
          exit 1
        fi
        echo "✅ Authorization enforcement verified"

      # Verify consent tracking
      - |
        echo "🔍 Checking consent tracking..."
        if ! grep -r "ConsentRepository" app/src/main 2>/dev/null; then
          echo "❌ ERROR: Consent tracking not implemented"
          exit 1
        fi
        if ! grep -r "logAuditEvent" app/src/main 2>/dev/null; then
          echo "⚠️  WARNING: Audit logging may be incomplete"
        fi
        echo "✅ Consent tracking verified"
    secrets: [ ]

  # ============================================
  # Stage 4: Unit Tests
  # ============================================
  unit-tests:
    image: android-ci:latest
    group: test
    when:
      not:
        message: "[skip tests]"
    commands:
      - echo "🧪 Running unit tests..."
      - chmod +x gradlew
      - ./gradlew nonexistentTaskThatWillCauseFailure --stacktrace
      - echo "✅ Unit tests complete"
    secrets: [ ]

  # ============================================
  # Stage 5: Test Coverage
  # ============================================
  coverage:
    image: android-ci:latest
    group: test
    when:
      not:
        message: "[skip tests]"
    commands:
      - echo "📊 Generating test coverage report..."
      - chmod +x gradlew
      - ./gradlew jacocoTestReport || true
      - ./gradlew jacocoTestCoverageVerification || true
      - |
        # Check coverage threshold (80%)
        echo "🔍 Checking coverage threshold..."
        coverage=$(./gradlew jacocoTestReport 2>&1 | grep -oP 'Total.*?\K\d+(?=%)' || echo "0")
        if [ "$coverage" -lt 80 ]; then
          echo "⚠️  WARNING: Test coverage below 80% (current: $coverage%)"
        else
          echo "✅ Test coverage: $coverage% (meets 80% threshold)"
        fi
    secrets: [ ]

  # ============================================
  # Stage 6: Android Lint
  # ============================================
  android-lint:
    image: android-ci:latest
    group: lint
    when:
      not:
        message: "[skip lint]"
    commands:
      - echo "🔍 Running Android Lint..."
      - chmod +x gradlew
      - ./gradlew lintDebug || true
      - echo "✅ Android Lint complete - check reports for issues"
    secrets: [ ]

  # ============================================
  # Stage 7: Dependency Check
  # ============================================
  dependency-check:
    image: android-ci:latest
    group: security
    when:
      not:
        message: "[skip deps]"
    commands:
      - echo "🔍 Running dependency vulnerability scan..."
      - chmod +x gradlew
      - ./gradlew dependencyCheckAnalyze || true
      - echo "✅ Dependency check complete - see app/build/reports/dependency-check-report.html"
    secrets: [ ]

  # ============================================
  # Stage 8: Build APK
  # ============================================
  build-debug:
    image: android-ci:latest
    group: build
    when:
      not:
        message: "[skip build]"
    commands:
      - echo "🔨 Building debug APK..."
      - chmod +x gradlew
      - ./gradlew assembleDevDebug assembleProdDebug --stacktrace
      - echo "✅ Debug APKs built successfully"
      - ls -lh app/build/outputs/apk/*/debug/*.apk
    secrets: [ ]

  # ============================================
  # Stage 9: Build Release APK (main/tags only)
  # ============================================
  build-release:
    image: android-ci:latest
    group: build
    when:
      event:
        - push
        - tag
      branch:
        - main
      not:
        message: "[skip build]"
    commands:
      - echo "🔐 Building release APK..."
      - chmod +x gradlew
      - |
        # Check if signing credentials are available
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE="$PWD/release.keystore" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"
        else
          echo "⚠️  No signing credentials found, building unsigned APK"
          ./gradlew assembleRelease
        fi
      - echo "✅ Release APK built successfully"
      - ls -lh app/build/outputs/apk/release/*.apk
    secrets:
      - KEYSTORE_BASE64
      - KEYSTORE_PASSWORD
      - KEY_ALIAS
      - KEY_PASSWORD

  # ============================================
  # Stage 10: Instrumented Tests (optional)
  # ============================================
  instrumented-tests:
    image: android-emulator:latest
    group: integration
    when:
      not:
        message: "[skip instrumented]"
    commands:
      - echo "📱 Running instrumented tests on emulator..."
      - chmod +x gradlew
      - |
        # Start emulator in background
        emulator -avd test -no-window -no-audio -no-boot-anim &
        EMULATOR_PID=$!

        # Wait for emulator to boot
        echo "⏳ Waiting for emulator to boot..."
        adb wait-for-device
        sleep 30

        # Run instrumented tests
        ./gradlew connectedDevDebugAndroidTest || true

        # Stop emulator
        kill $EMULATOR_PID || true
      - echo "✅ Instrumented tests complete"
    secrets: [ ]

  # ============================================
  # Stage 11: Collect Artifacts
  # ============================================
  collect-artifacts:
    image: alpine:latest
    group: artifacts
    commands:
      - echo "📦 Collecting build artifacts..."

      # Create artifacts directory
      - mkdir -p /woodpecker/artifacts

      # Copy APK files
      - |
        if [ -d app/build/outputs/apk ]; then
          cp -rv app/build/outputs/apk /woodpecker/artifacts/ 2>/dev/null || true
          echo "✅ APK artifacts collected"
        fi

      # Copy test results
      - |
        if [ -d app/build/test-results ]; then
          cp -rv app/build/test-results /woodpecker/artifacts/ 2>/dev/null || true
          echo "✅ Test results collected"
        fi

      # Copy coverage reports
      - |
        if [ -d app/build/reports/jacoco ]; then
          cp -rv app/build/reports/jacoco /woodpecker/artifacts/ 2>/dev/null || true
          echo "✅ Coverage reports collected"
        fi

      # Copy lint reports
      - |
        if [ -d app/build/reports/lint-results ]; then
          cp -rv app/build/reports /woodpecker/artifacts/ 2>/dev/null || true
          echo "✅ Lint reports collected"
        fi

      # Copy dependency check reports
      - |
        if [ -f app/build/reports/dependency-check-report.html ]; then
          cp -v app/build/reports/dependency-check-report.html /woodpecker/artifacts/ 2>/dev/null || true
          echo "✅ Dependency check report collected"
        fi

      # Copy ktlint report
      - |
        if [ -f build/ktlint-report.xml ]; then
          cp -v build/ktlint-report.xml /woodpecker/artifacts/ 2>/dev/null || true
          echo "✅ ktlint report collected"
        fi

      # List all artifacts
      - echo "📋 Artifacts collected:"
      - find /woodpecker/artifacts -type f -o -type d | head -50
    secrets: [ ]

# ============================================
# Pipeline Settings
# ============================================
# Cache Gradle dependencies
clone:
  git:
    image: plugins/git

# Cache configuration
volumes:
  - name: gradle-cache
    temp: {}
  - name: gradle-wrapper
    temp: {}

# Workspace for sharing data between steps
workspace:
  base: /woodpecker
  path: src

# Trigger on branches
branches:
  include:
    - main
    - develop
  exclude:
    - gh-pages

# ============================================
# Notes on Conversion
# ============================================
# Features NOT ported from GitHub Actions:
# 1. CodeQL - Not supported in Woodpecker (requires GitHub infrastructure)
# 2. PR Comments - GitHub-specific (keep in GitHub Actions)
# 3. JUnit Report Publishing - GitHub-specific (keep in GitHub Actions)
# 4. Coverage Comments on PR - GitHub-specific (keep in GitHub Actions)
# 5. Semantic Release - Requires GitHub API (keep in GitHub Actions)
# 6. PR Labeler - GitHub-specific (keep in GitHub Actions)
# 7. Release Creation - GitHub-specific (keep in GitHub Actions)
#
# Recommendations:
# - Keep these workflows in GitHub Actions:
#   * semantic-release.yml (requires GitHub API for releases)
#   * pr-checks.yml (better GitHub integration for PR comments)
# - Use Woodpecker CI for:
#   * Main CI/CD pipeline (build, test, lint, security)
#   * Faster feedback with Docker-based builds
#   * Self-hosted infrastructure control
