# Project-wide Gradle settings

# AndroidX package structure to use
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable Gradle build cache
org.gradle.caching=true

# Enable configuration cache (experimental in Gradle 7.0+)
org.gradle.configuration-cache=true

# Enable parallel execution
org.gradle.parallel=true

# Kotlin incremental compilation
kotlin.incremental=true

# Enable AndroidX migration
android.enableJetifier=true

# Non-transitive R class names
android.nonTransitiveRClass=true

# Enable R8 full mode
android.enableR8.fullMode=true

# Compose compiler options
kotlin.compose.compiler.metrics=true
kotlin.compose.compiler.reports=true

# JVM arguments for Gradle
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Force Gradle to use Java 17 (required for Kotlin 1.9.21)
# org.gradle.java.home removed to fix CI build

# Enable Gradle build scan (requires active scan subscription)
# org.gradle.scan.capture=true

# AndroidX preferences
android.defaults.buildfeatures.buildconfig=true
android.useAndroidX=true
